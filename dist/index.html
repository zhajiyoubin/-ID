<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小红书 ID 提取器</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#211b1b;background:#fff7f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#ffe3df,transparent 38%),#fff7f5}.wrap{max-width:860px;margin:auto;padding:56px 20px}.brand{display:inline-flex;align-items:center;gap:8px;color:#ff2442;font-weight:800;letter-spacing:.04em}.dot{width:12px;height:12px;border-radius:50%;background:#ff2442;box-shadow:0 0 0 5px #ffd7dc}.hero{margin:34px 0 26px}.hero h1{font-size:clamp(32px,6vw,56px);line-height:1.05;margin:0 0 14px;letter-spacing:-.04em}.hero p{font-size:18px;color:#766b6b;margin:0}.card{background:#fff;border:1px solid #f1dddd;border-radius:24px;padding:22px;box-shadow:0 20px 50px #d984841f}.label{font-weight:700;margin-bottom:10px;display:block}textarea{width:100%;min-height:180px;resize:vertical;border:1px solid #ecd3d3;border-radius:16px;padding:16px;font:inherit;font-size:16px;line-height:1.6;outline:none}textarea:focus{border-color:#ff5870;box-shadow:0 0 0 4px #ff244214}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#ff2442;color:#fff}.secondary{background:#fff0f1;color:#d91f3a}.result{margin-top:24px;display:none}.result.show{display:block}.resultHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.count{color:#908080;font-size:14px}.output{max-height:520px;overflow:auto;background:#241f20;color:#fff;border-radius:16px;padding:16px;white-space:pre-wrap;word-break:break-all;min-height:100px;font:16px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace}.admin{display:none;max-height:220px;overflow:auto;margin-top:12px;padding:12px;border-radius:12px;background:#fff4f4;color:#8b2f3b;white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace}.admin.show{display:block}.hint{font-size:14px;color:#918181;margin-top:14px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#241f20;color:white;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}</style></head><body><main class="wrap"><div class="brand"><span class="dot"></span>小红书工具</div><section class="hero"><h1>提取小红书用户 ID</h1><p>粘贴个人主页链接，自动整理出纯 ID。支持批量处理。</p></section><section class="card"><label class="label" for="input">输入链接</label><textarea id="input" placeholder="每行粘贴一个链接，例如：&#10;https://www.xiaohongshu.com/user/profile/697456570000000021023fe7"></textarea><div class="actions"><button class="primary" id="extract">提取 ID</button><button class="secondary" id="clear">清空</button></div><div class="result" id="result"><div class="resultHead"><strong>提取结果</strong><span class="count" id="count"></span></div><div class="output" id="output"></div><div class="actions"><button class="primary" id="copy">复制全部结果</button><button class="secondary" id="diagBtn">管理员诊断</button></div><pre class="admin" id="admin"></pre></div></div><div class="hint">支持普通链接、带 ? 参数的分享链接和 xhslink.com 短链接，自动忽略重复项。</div></section></main><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s), input=$('#input'), result=$('#result'), output=$('#output'), count=$('#count'), toast=$('#toast');
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
async function extract(){const lines=input.value.split(/\n|\r/).map(x=>x.trim()).filter(Boolean), results=[], errors=[]; for(const line of lines){const clean=line.replace(/[\[\]()<>{}|`]/g,'').replace(/\\&/g,'&').trim(); let m=clean.match(/(?:https?:\/\/)?(?:www\.)?(?:xiaohongshu\.com|xhslink\.com)\/user\/profile\/([^/?#\s&]+)/i); if(!m&&/^https?:\/\//i.test(clean)){try{let j=null; try{const r=await fetch((location.protocol==='file:'?'http://localhost:8787':'')+'/api/resolve?url='+encodeURIComponent(clean)); j=await r.json()}catch(e){} if(!j||!j.id){try{const rr=await fetch('https://r.jina.ai/http://'+clean.replace(/^https?:\/\//,'')); const text=await rr.text(); const pm=text.match(/xiaohongshu\.com\/user\/profile\/([^/?#\s]+)/i); if(pm)j={id:pm[1]}}catch(e){}} if(j&&j.id)m=[0,j.id]}catch(e){console.warn('[解析失败]',line,e);}} if(!m){console.warn('[未解析]',line);errors.push({line,reason:'未匹配到用户ID，或短链接解析失败'})} results.push(m?m[1]:'null')} window.lastErrors=errors; const ok=results.filter(x=>x!=='null').length; output.textContent=results.join('\n');count.textContent=`${ok}/${lines.length}`;result.classList.add('show'); if(!ok)showToast('没有成功解析的链接')}
$('#extract').onclick=extract;$('#diagBtn').onclick=()=>{const a=$('#admin');a.textContent='本次解析诊断\n输入总数：'+input.value.split(/\n|\r/).filter(x=>x.trim()).length+'\n失败详情：\n'+(window.lastErrors||[]).map((e,i)=>(i+1)+'. '+e.reason+'\n   '+e.line).join('\n');a.classList.toggle('show')};$('#clear').onclick=()=>{input.value='';result.classList.remove('show');input.focus()};$('#copy').onclick=async()=>{if(!output.textContent)return;await navigator.clipboard.writeText(output.textContent);showToast('已复制到剪贴板')};input.addEventListener('paste',()=>setTimeout(extract,50));
</script></body></html>
